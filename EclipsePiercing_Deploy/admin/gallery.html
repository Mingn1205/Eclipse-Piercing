<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thư viện ảnh | Eclipse Piercing Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0A0A0A',
                        gold: '#D4AF37',
                        'gold-light': '#F3E5AB',
                        grayDark: '#1E1E1E',
                        grayMid: '#2A2A2A',
                        grayLight: '#B3B3B3',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
    </style>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-dark text-grayLight font-sans antialiased">
    <!-- Sidebar is injected by admin-core.js -->
    <div id="admin-sidebar" data-active="gallery"></div>
    
    <!-- Main Content -->
    <main id="admin-main" class="admin-main">
        <!-- Top Bar -->
        <header class="admin-topbar">
            <div class="flex items-center gap-3">
                <button id="sidebar-toggle" class="lg:hidden text-grayLight hover:text-white">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-bold text-white">Quản lý thư viện ảnh</h1>
            </div>
            <div id="admin-user-info"></div>
        </header>
        
        <!-- Page Content -->
        <div class="admin-content">
            <!-- Stats -->
            <div class="bg-grayDark/30 border border-grayDark/50 backdrop-blur-sm rounded-xl p-4 mb-6 flex gap-8">
                <div>
                    <span class="text-sm text-grayLight">Tổng số ảnh</span>
                    <div id="stat-total" class="text-2xl font-bold text-white">0</div>
                </div>
                <div>
                    <span class="text-sm text-grayLight">Đang hiển thị</span>
                    <div id="stat-visible" class="text-2xl font-bold text-gold">0</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 bg-grayDark/30 p-4 rounded-xl border border-grayMid">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <button id="btn-add-image" class="bg-gold hover:bg-gold-light text-dark font-semibold py-2 px-4 rounded-lg transition-colors flex items-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i>
                        Thêm ảnh mới
                    </button>
                    <div class="h-8 w-px bg-grayMid hidden md:block"></div>
                    <select id="filter-category" class="bg-dark border border-grayMid text-white text-sm rounded-lg focus:border-gold block p-2">
                        <option value="all">Tất cả danh mục</option>
                        <option value="ear">Xỏ Tai</option>
                        <option value="face">Xỏ Mặt</option>
                        <option value="body">Xỏ Cơ Thể</option>
                        <option value="studio">Studio</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="relative w-full md:w-64">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <i class="fa-solid fa-search text-grayLight"></i>
                        </div>
                        <input type="text" id="search-input" class="bg-dark border border-grayMid text-white text-sm rounded-lg focus:border-gold block w-full pl-10 p-2" placeholder="Tìm kiếm Alt text...">
                    </div>
                </div>
            </div>
            
            <!-- Bulk Actions (Hidden by default) -->
            <div id="bulk-actions" class="hidden flex items-center justify-between bg-gold/10 border border-gold/30 rounded-xl p-3 mb-6">
                <div class="flex items-center gap-2">
                    <span class="text-gold font-medium"><span id="selected-count">0</span> ảnh đã chọn</span>
                    <button id="btn-cancel-selection" class="text-sm text-grayLight hover:text-white ml-2 underline">Hủy chọn</button>
                </div>
                <button id="btn-bulk-delete" class="bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-trash"></i> Xóa đã chọn
                </button>
            </div>

            <!-- Image Grid -->
            <div id="gallery-grid" class="image-grid">
                <!-- Items generated by JS -->
            </div>

            <!-- Empty State -->
            <div id="gallery-empty" class="hidden bg-grayDark/30 border border-grayDark/50 backdrop-blur-sm rounded-2xl p-12 flex flex-col items-center justify-center text-center mt-6">
                <i class="fa-regular fa-image text-5xl text-grayMid mb-4"></i>
                <h3 class="text-xl text-white font-medium mb-2">Chưa có ảnh nào</h3>
                <p class="text-grayLight mb-6">Thêm ảnh vào thư viện để khách hàng có thể tham khảo</p>
                <button id="btn-empty-add" class="bg-gold hover:bg-gold-light text-dark font-semibold py-2 px-6 rounded-lg transition-colors">
                    Thêm ảnh ngay
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="image-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-grayDark border border-grayMid rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-6 border-b border-grayMid">
                <h2 id="modal-title" class="text-xl font-bold text-white">Thêm ảnh mới</h2>
                <button id="btn-close-modal" class="text-grayLight hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="image-form" class="p-6">
                <input type="hidden" id="image-id">
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-grayLight mb-2">Đường dẫn ảnh (URL) *</label>
                    <input type="text" id="image-url" required placeholder="https://... hoặc /images/..." class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                    <div id="image-preview-container" class="mt-3 hidden">
                        <img id="image-preview" src="" alt="Preview" class="w-full h-40 object-cover rounded-lg border border-grayMid">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-grayLight mb-2">Alt Text (Tốt cho SEO) *</label>
                    <input type="text" id="image-alt" required class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-grayLight mb-2">Chú thích (Caption)</label>
                    <input type="text" id="image-caption" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-grayLight mb-2">Danh mục *</label>
                    <select id="image-category" required class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                        <option value="ear">Xỏ Tai</option>
                        <option value="face">Xỏ Mặt</option>
                        <option value="body">Xỏ Cơ Thể</option>
                        <option value="studio">Không gian Studio</option>
                    </select>
                </div>

                <div class="flex items-center gap-3 mb-6">
                    <input type="checkbox" id="image-visibility" checked class="w-5 h-5 accent-gold bg-dark border-grayMid rounded">
                    <label for="image-visibility" class="text-sm font-medium text-white">Hiển thị trong thư viện</label>
                </div>

                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" id="btn-cancel" class="px-6 py-2 rounded-lg border border-grayMid text-grayLight hover:bg-grayMid transition-colors">
                        Hủy
                    </button>
                    <button type="submit" class="bg-gold hover:bg-gold-light text-dark font-semibold px-6 py-2 rounded-lg transition-colors">
                        Lưu ảnh
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 bg-black/95 z-[60] hidden flex-col items-center justify-center p-4">
        <button id="btn-close-lightbox" class="absolute top-6 right-6 text-white hover:text-gold transition-colors z-10">
            <i class="fa-solid fa-xmark text-3xl"></i>
        </button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[80vh] object-contain mb-4">
        <div id="lightbox-caption" class="text-white text-lg"></div>
    </div>

    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-gallery.js"></script>
</body>
</html>
