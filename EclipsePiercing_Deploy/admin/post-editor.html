<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa bài viết | Eclipse Piercing Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Quill.js CDN -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0A0A0A',
                        gold: '#D4AF37',
                        'gold-light': '#F3E5AB',
                        grayDark: '#1E1E1E',
                        grayMid: '#2A2A2A',
                        grayLight: '#B3B3B3',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .ql-toolbar.ql-snow, .ql-container.ql-snow {
            border-color: #2A2A2A;
            background-color: rgba(30, 30, 30, 0.5);
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .ql-toolbar.ql-snow { border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; }
        .ql-container.ql-snow { border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; min-height: 400px; }
        .ql-snow .ql-stroke { stroke: #B3B3B3; }
        .ql-snow .ql-fill { fill: #B3B3B3; }
        .ql-snow .ql-picker { color: #B3B3B3; }
        .ql-snow .ql-picker-options { background-color: #1E1E1E; border-color: #2A2A2A; }
    </style>
</head>
<body class="bg-dark text-grayLight font-sans antialiased">
    <div id="admin-sidebar" data-active="posts"></div>
    
    <main id="admin-main" class="admin-main">
        <header class="admin-topbar">
            <div class="flex items-center gap-3">
                <button id="sidebar-toggle" class="lg:hidden text-grayLight hover:text-white">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-bold text-white" id="page-title-display">Thêm bài viết mới</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="auto-save-status" class="text-sm text-grayLight hidden"><i class="fa-solid fa-check text-green-500 mr-1"></i>Đã lưu lúc 10:00</span>
                <button id="btn-preview" type="button" class="px-4 py-2 bg-grayDark border border-grayMid text-white rounded-lg hover:bg-grayMid transition-colors">
                    <i class="fa-solid fa-eye mr-2"></i>Xem trước
                </button>
                <div id="admin-user-info"></div>
            </div>
        </header>
        
        <div class="admin-content">
            <form id="post-form" class="flex flex-col lg:flex-row gap-6">
                <!-- Left Column (70%) -->
                <div class="w-full lg:w-[70%] flex flex-col gap-6">
                    <div class="bg-grayDark/30 border border-grayDark/50 backdrop-blur-sm rounded-2xl p-6">
                        <div class="mb-4">
                            <label for="post-title" class="block text-white font-medium mb-2">Tiêu đề bài viết <span class="text-red-500">*</span></label>
                            <input type="text" id="post-title" required class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold text-lg font-medium" placeholder="Nhập tiêu đề...">
                        </div>
                        <div class="mb-4">
                            <label for="post-slug" class="block text-white font-medium mb-2">Đường dẫn (Slug)</label>
                            <input type="text" id="post-slug" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-grayLight focus:outline-none focus:border-gold font-mono text-sm" placeholder="duong-dan-bai-viet">
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-white font-medium mb-2">Nội dung <span class="text-red-500">*</span></label>
                            <div id="editor-container"></div>
                        </div>

                        <div>
                            <label for="post-excerpt" class="block text-white font-medium mb-2">Tóm tắt (Excerpt)</label>
                            <textarea id="post-excerpt" rows="3" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold" placeholder="Viết đoạn tóm tắt ngắn cho bài viết..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Right Column (30%) -->
                <div class="w-full lg:w-[30%] flex flex-col gap-6">
                    <!-- Actions -->
                    <div class="bg-grayDark/30 border border-grayDark/50 backdrop-blur-sm rounded-2xl p-6">
                        <h3 class="text-white font-medium text-lg mb-4">Đăng bài</h3>
                        <div class="mb-4">
                            <label for="post-status" class="block text-sm mb-1">Trạng thái</label>
                            <select id="post-status" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                                <option value="draft">Nháp</option>
                                <option value="published">Đã đăng</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-3 mt-6">
                            <button type="button" id="btn-save-draft" class="w-full px-4 py-2 bg-grayDark border border-grayMid text-white rounded-lg hover:bg-grayMid transition-colors">
                                Lưu nháp
                            </button>
                            <button type="submit" id="btn-publish" class="w-full px-4 py-2 bg-gold text-dark font-medium rounded-lg hover:bg-gold-light transition-colors">
                                <i class="fa-solid fa-paper-plane mr-2"></i>Đăng bài
                            </button>
                        </div>
                    </div>

                    <!-- Meta -->
                    <div class="bg-grayDark/30 border border-grayDark/50 backdrop-blur-sm rounded-2xl p-6">
                        <h3 class="text-white font-medium text-lg mb-4">Phân loại</h3>
                        <div class="mb-4">
                            <label for="post-category" class="block text-sm mb-1">Danh mục</label>
                            <select id="post-category" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                                <option value="Kien-thuc">Kiến thức</option>
                                <option value="Tin-tuc">Tin tức</option>
                                <option value="Cham-soc">Chăm sóc</option>
                                <option value="Huong-dan">Hướng dẫn</option>
                            </select>
                        </div>
                        <div>
                            <label for="post-tags" class="block text-sm mb-1">Thẻ (Tags) - Phân cách bằng dấu phẩy</label>
                            <input type="text" id="post-tags" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold" placeholder="Khuyên tai, chăm sóc...">
                        </div>
                    </div>

                    <!-- Featured Image -->
                    <div class="bg-grayDark/30 border border-grayDark/50 backdrop-blur-sm rounded-2xl p-6">
                        <h3 class="text-white font-medium text-lg mb-4">Ảnh đại diện</h3>
                        <div class="mb-4">
                            <input type="text" id="post-image-url" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold mb-2" placeholder="URL ảnh...">
                            <div id="image-preview" class="w-full h-40 bg-dark border border-grayMid rounded-lg flex items-center justify-center overflow-hidden">
                                <span class="text-grayLight text-sm"><i class="fa-regular fa-image text-2xl mb-1 block text-center"></i>Chưa có ảnh</span>
                            </div>
                        </div>
                    </div>

                    <!-- SEO -->
                    <div class="bg-grayDark/30 border border-grayDark/50 backdrop-blur-sm rounded-2xl p-6">
                        <h3 class="text-white font-medium text-lg mb-4">SEO</h3>
                        <div class="mb-4">
                            <label for="seo-title" class="flex justify-between text-sm mb-1">
                                <span>Meta Title</span>
                                <span id="seo-title-count" class="text-grayLight">0/60</span>
                            </label>
                            <input type="text" id="seo-title" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                        </div>
                        <div class="mb-4">
                            <label for="seo-desc" class="flex justify-between text-sm mb-1">
                                <span>Meta Description</span>
                                <span id="seo-desc-count" class="text-grayLight">0/160</span>
                            </label>
                            <textarea id="seo-desc" rows="3" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold"></textarea>
                        </div>
                        
                        <!-- SERP Preview -->
                        <div class="mt-4 p-4 bg-white rounded-lg">
                            <div class="text-sm text-[#202124] mb-1">eclipse-piercing.vn <span class="text-[#5f6368]">> blog > <span id="serp-slug">...</span></span></div>
                            <div id="serp-title" class="text-[#1a0dab] text-lg cursor-pointer hover:underline truncate">Tiêu đề SEO</div>
                            <div id="serp-desc" class="text-[#4d5156] text-sm line-clamp-2">Mô tả SEO sẽ hiển thị ở đây...</div>
                        </div>

                        <!-- SEO Score -->
                        <div class="mt-4 border-t border-grayMid pt-4">
                            <h4 class="text-white text-sm font-medium mb-2">Điểm SEO: <span id="seo-score-text" class="text-gold">0/100</span></h4>
                            <ul class="text-sm space-y-1" id="seo-checklist">
                                <li class="text-red-400"><i class="fa-solid fa-xmark w-4"></i> Tiêu đề SEO (50-60 ký tự)</li>
                                <li class="text-red-400"><i class="fa-solid fa-xmark w-4"></i> Mô tả SEO (120-160 ký tự)</li>
                                <li class="text-red-400"><i class="fa-solid fa-xmark w-4"></i> Có ảnh đại diện</li>
                                <li class="text-red-400"><i class="fa-solid fa-xmark w-4"></i> Nội dung đủ dài (>300 từ)</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-posts.js"></script>
</body>
</html>
