<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý dịch vụ | Eclipse Piercing Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0A0A0A',
                        gold: '#D4AF37',
                        'gold-light': '#F3E5AB',
                        grayDark: '#1E1E1E',
                        grayMid: '#2A2A2A',
                        grayLight: '#B3B3B3',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-dark text-grayLight font-sans antialiased">
    <!-- Sidebar is injected by admin-core.js -->
    <div id="admin-sidebar" data-active="services"></div>
    
    <!-- Main Content -->
    <main id="admin-main" class="admin-main">
        <!-- Top Bar -->
        <header class="admin-topbar">
            <div class="flex items-center gap-3">
                <button id="sidebar-toggle" class="lg:hidden text-grayLight hover:text-white">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-bold text-white">Quản lý dịch vụ</h1>
            </div>
            <div id="admin-user-info"></div>
        </header>
        
        <!-- Page Content -->
        <div class="admin-content">
            <!-- Header actions -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <!-- Filters -->
                <div class="flex gap-2 border-b border-grayMid pb-2 w-full md:w-auto overflow-x-auto" id="service-filters">
                    <button class="filter-btn text-gold border-b-2 border-gold px-4 py-2 whitespace-nowrap" data-filter="all">Tất cả</button>
                    <button class="filter-btn text-grayLight hover:text-white px-4 py-2 whitespace-nowrap" data-filter="ear">Xỏ Tai</button>
                    <button class="filter-btn text-grayLight hover:text-white px-4 py-2 whitespace-nowrap" data-filter="face">Xỏ Mặt</button>
                    <button class="filter-btn text-grayLight hover:text-white px-4 py-2 whitespace-nowrap" data-filter="body">Xỏ Cơ Thể</button>
                </div>
                <button id="btn-add-service" class="bg-gold hover:bg-gold-light text-dark font-semibold py-2 px-4 rounded-lg transition-colors flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i>
                    Thêm dịch vụ mới
                </button>
            </div>

            <!-- Services Grid -->
            <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Grid items generated by JS -->
            </div>

            <!-- Empty State -->
            <div id="services-empty" class="hidden bg-grayDark/30 border border-grayDark/50 backdrop-blur-sm rounded-2xl p-12 flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-gem text-5xl text-grayMid mb-4"></i>
                <h3 class="text-xl text-white font-medium mb-2">Chưa có dịch vụ nào</h3>
                <p class="text-grayLight mb-6">Thêm dịch vụ đầu tiên để hiển thị trên website</p>
                <button id="btn-empty-add" class="bg-gold hover:bg-gold-light text-dark font-semibold py-2 px-6 rounded-lg transition-colors">
                    Thêm dịch vụ ngay
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="service-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-grayDark border border-grayMid rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-6 border-b border-grayMid">
                <h2 id="modal-title" class="text-xl font-bold text-white">Thêm dịch vụ mới</h2>
                <button id="btn-close-modal" class="text-grayLight hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="service-form" class="p-6">
                <input type="hidden" id="service-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-grayLight mb-2">Tên dịch vụ (VN) *</label>
                        <input type="text" id="service-name-vn" required class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-grayLight mb-2">Tên dịch vụ (EN)</label>
                        <input type="text" id="service-name-en" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-grayLight mb-2">Mô tả *</label>
                    <textarea id="service-description" required rows="3" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-grayLight mb-2">Danh mục *</label>
                        <select id="service-category" required class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                            <option value="ear">Xỏ Tai</option>
                            <option value="face">Xỏ Mặt</option>
                            <option value="body">Xỏ Cơ Thể</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-grayLight mb-2">Nhãn (Tag) VD: Bán chạy</label>
                        <input type="text" id="service-badge" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-grayLight mb-2">Mức độ đau (1-10) *</label>
                        <input type="number" id="service-pain" required min="1" max="10" value="5" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-grayLight mb-2">Thời gian lành *</label>
                        <input type="text" id="service-healing" required placeholder="VD: 2-3 tháng" class="w-full bg-dark border border-grayMid rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold">
                    </div>
                </div>

                <div class="flex items-center gap-3 mb-6">
                    <input type="checkbox" id="service-visibility" checked class="w-5 h-5 accent-gold bg-dark border-grayMid rounded">
                    <label for="service-visibility" class="text-sm font-medium text-white">Hiển thị trên website</label>
                </div>

                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" id="btn-cancel" class="px-6 py-2 rounded-lg border border-grayMid text-grayLight hover:bg-grayMid transition-colors">
                        Hủy
                    </button>
                    <button type="submit" class="bg-gold hover:bg-gold-light text-dark font-semibold px-6 py-2 rounded-lg transition-colors">
                        Lưu dịch vụ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-services.js"></script>
</body>
</html>
