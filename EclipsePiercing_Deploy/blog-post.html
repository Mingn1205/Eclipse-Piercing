<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết | Eclipse Piercing Blog</title>
    <meta name="description" content="Eclipse Piercing Blog - Kiến thức về xỏ khuyên, hướng dẫn chăm sóc và xu hướng piercing.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0A0A0A',
                        gold: '#D4AF37',
                        grayDark: '#1E1E1E',
                        grayLight: '#B3B3B3',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/blog.css">
    <style>
        body { background-color: #0A0A0A; color: #B3B3B3; overflow-x: hidden; }
        h1, h2, h3, h4, h5, h6 { color: #FFFFFF; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #1E1E1E; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
        .text-gradient {
            background: linear-gradient(to right, #D4AF37, #F3E5AB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .btn-primary { background: #D4AF37; color: #0A0A0A; }
        .btn-primary:hover { background: #FFFFFF; }
    </style>
</head>
<body class="antialiased selection:bg-gold selection:text-dark">

    <!-- Navbar -->
    <header class="fixed w-full top-0 z-50">
        <div class="absolute inset-0 bg-dark/90 backdrop-blur-md border-b border-grayDark"></div>
        <div class="container mx-auto px-6 relative z-10">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="https://res.cloudinary.com/dmqg578zx/image/upload/f_auto,q_auto/ChatGPT_Image_13_32_42_4_thg_6_2026_efamgb" alt="Eclipse Piercing" class="h-12 w-auto" onerror="this.src='https://placehold.co/48x48/1E1E1E/D4AF37?text=EP'">
                    <span class="text-white font-bold text-xl tracking-wider uppercase hidden sm:block">Eclipse</span>
                </a>
                <nav class="hidden md:flex items-center gap-8">
                    <a href="index.html" class="text-sm font-medium text-grayLight hover:text-gold transition-colors">Trang chủ</a>
                    <a href="index.html#services" class="text-sm font-medium text-grayLight hover:text-gold transition-colors">Dịch vụ</a>
                    <a href="index.html#gallery" class="text-sm font-medium text-grayLight hover:text-gold transition-colors">Thư viện</a>
                    <a href="blog.html" class="text-sm font-medium text-gold">Blog</a>
                </nav>
                <a href="index.html#booking" class="hidden md:flex items-center gap-2 bg-gold text-dark px-6 py-2.5 rounded-full font-semibold hover:bg-white transition-colors">
                    <span>Đặt lịch</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Blog Post Content -->
    <section class="pt-32 pb-16 bg-dark min-h-screen">
        <div class="container mx-auto px-6">
            <div id="blog-post-content" class="blog-post-content">
                <!-- Content rendered by blog.js -->
                <div class="text-center py-20">
                    <div class="w-12 h-12 border-2 border-gold border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-grayLight">Đang tải bài viết...</p>
                </div>
            </div>

            <!-- Related Posts -->
            <div id="related-posts" class="related-posts max-w-[760px] mx-auto"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark border-t border-grayDark py-12">
        <div class="container mx-auto px-6 text-center">
            <img src="https://res.cloudinary.com/dmqg578zx/image/upload/f_auto,q_auto/ChatGPT_Image_13_32_42_4_thg_6_2026_efamgb" alt="Eclipse Piercing" class="h-16 mx-auto mb-4" onerror="this.src='https://placehold.co/64x64/1E1E1E/D4AF37?text=EP'">
            <p class="text-grayLight/50 text-sm mb-2">&copy; 2024 Eclipse Piercing. All rights reserved.</p>
            <div class="flex justify-center gap-4 mt-4">
                <a href="https://www.facebook.com/xokhuyeneclipse" target="_blank" class="text-grayLight/40 hover:text-gold transition-colors"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/naivebinnmuseum/" target="_blank" class="text-grayLight/40 hover:text-gold transition-colors"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="js/blog.js"></script>
</body>
</html>
